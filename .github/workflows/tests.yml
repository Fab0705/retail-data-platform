name: Retail Platform CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    # Levantamos un contenedor de PostgreSQL efímero para las pruebas de integración
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: retail_dw
          POSTGRES_USER: retail_user
          POSTGRES_PASSWORD: retail_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest

    - name: Lint with flake8
      run: |
        # Detiene el build si hay errores de sintaxis críticos
        flake8 src/ scripts/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Las advertencias generales no rompen el build
        flake8 src/ scripts/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Initialize Database Schema
      run: |
        # Preparamos las tablas para que las pruebas de integración funcionen
        python scripts/initialize_db.py

    - name: Run Unit tests
      run: |
        python -m pytest tests/unit/ -v

    - name: Run Integration tests
      run: |
        python -m pytest tests/integration/ -v

    - name: Build project
      run: |
        echo "Validación exitosa. Código listo para despliegue (CD)."
        # Aquí iría el comando de empaquetado final si fuera necesario